services:
  mongodb:
    image: mongo:7.0
    container_name: glowflow-catalog-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: GlowFlowCatalogDB
    volumes:
      - catalog-mongo-data:/data/db
    networks:
      - glowflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-db:
    image: postgres:16-alpine
    container_name: glowflow-orders-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: glowflow_orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    volumes:
      - orders-pg-data:/var/lib/postgresql/data
    networks:
      - glowflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d glowflow_orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: consul:1.15
    container_name: glowflow-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    networks:
      - glowflow-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  makeup-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makeup-catalog-service
    ports:
      - "3010:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/GlowFlowCatalogDB
      JWT_SECRET: glowflow_catalog_secret_key_change_in_production
      NODE_ENV: production
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: makeup-catalog-service
      ORDERS_SERVICE_URL: http://orders-service:3002
    depends_on:
      mongodb:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - glowflow-network
    restart: unless-stopped
    volumes:
      - catalog-uploads:/app/public/uploads

  orders-service:
    build:
      context: ./orders
      dockerfile: Dockerfile
    container_name: glowflow-orders-service
    ports:
      - "3011:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://orders_user:orders_pass@orders-db:5432/glowflow_orders_db
      JWT_SECRET: glowflow_catalog_secret_key_change_in_production
      NODE_ENV: production
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: orders-service
      CATALOG_SERVICE_NAME: makeup-catalog-service
      CATALOG_FALLBACK_URL: http://makeup-catalog-service:3001
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      orders-db:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - glowflow-network
    restart: unless-stopped

volumes:
  catalog-mongo-data:
  catalog-uploads:
  orders-pg-data:

networks:
  glowflow-network:
    driver: bridge

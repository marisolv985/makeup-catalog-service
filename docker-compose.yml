services:
  mongodb:
    image: mongo:7.0
    container_name: glowflow-catalog-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: GlowFlowCatalogDB
    volumes:
      - catalog-mongo-data:/data/db
    networks:
      - glowflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: consul:1.15
    container_name: glowflow-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    networks:
      - glowflow-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  makeup-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makeup-catalog-service
    ports:
      - "3010:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/GlowFlowCatalogDB
      JWT_SECRET: glowflow_catalog_secret_key_change_in_production
      NODE_ENV: production
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: makeup-catalog-service
    depends_on:
      mongodb:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - glowflow-network
    restart: unless-stopped
    volumes:
      - catalog-uploads:/app/public/uploads

volumes:
  catalog-mongo-data:
  catalog-uploads:

networks:
  glowflow-network:
    driver: bridge
